<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="800" height="256">
<style>
.walker{animation:walk 9s linear infinite}
@keyframes walk{0%{transform:translate(-20px,31px)}100%{transform:translate(204px,31px)}}
.f1{animation:a .3s steps(1) infinite}.f2{animation:b .3s steps(1) infinite}
@keyframes a{0%{opacity:1}50%{opacity:0}}@keyframes b{0%{opacity:0}50%{opacity:1}}
</style>
<image width="200" height="64" style="image-rendering:pixelated;image-rendering:crisp-edges" href="data:image/png;base64,"/>
<g class="walker"><rect x="2" y="22" width="12" height="1" fill="#3c1e28" opacity=".25"/>
<image class="f1" width="16" height="23" style="image-rendering:pixelated;image-rendering:crisp-edges" href="data:image/png;base64,"/>
<image class="f2" width="16" height="23" style="image-rendering:pixelated;image-rendering:crisp-edges" href="data:image/png;base64,"/></g>
</svg>
